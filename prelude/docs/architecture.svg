<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-label="Prelude architecture: four layers with a one-way dependency rule">
  <title>Prelude — four layers, arrows point inward</title>
  <desc>Layer 1 Even Hub (bridge, gate, containers, controller) depends on the core. Layer 2 the Next.js API depends on the core and integrations. Layer 3 the pure core imports nothing outward. Layer 4 integrations hold every provider token.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c0a"/>
      <stop offset="1" stop-color="#0b1210"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dffa8"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5f57"/>
    </marker>
  </defs>

  <rect width="980" height="600" fill="url(#bg)"/>
  <text x="28" y="42" fill="#e8f5ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600">Prelude — four layers, one dependency rule</text>
  <text x="28" y="66" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">arrows point inward · src/core imports nothing outward</text>

  <!-- Layer 1 -->
  <g>
    <rect x="28" y="92" width="452" height="150" rx="14" fill="#0e1a15" stroke="#2a3a32"/>
    <text x="46" y="120" fill="#7dffa8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6">1 · EVEN HUB LAYER</text>
    <text x="46" y="140" fill="#c8ffe0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">the only layer that imports the SDK</text>

    <rect x="46" y="154" width="140" height="66" rx="8" fill="#12211b" stroke="#37503f"/>
    <text x="58" y="176" fill="#c8ffe0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">bridge.ts</text>
    <text x="58" y="194" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">SDK events</text>
    <text x="58" y="208" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">CLICK_EVENT = 0</text>

    <rect x="196" y="154" width="130" height="66" rx="8" fill="#12211b" stroke="#37503f"/>
    <text x="208" y="176" fill="#c8ffe0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">gate.ts</text>
    <text x="208" y="194" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">swipe 700 ms</text>
    <text x="208" y="208" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">tap 350 ms</text>

    <rect x="336" y="154" width="126" height="66" rx="8" fill="#12211b" stroke="#37503f"/>
    <text x="348" y="176" fill="#c8ffe0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">containers.ts</text>
    <text x="348" y="194" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">576×288</text>
    <text x="348" y="208" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">≤999 bytes/band</text>
  </g>

  <!-- Layer 2 -->
  <g>
    <rect x="500" y="92" width="452" height="150" rx="14" fill="#0e1a15" stroke="#2a3a32"/>
    <text x="518" y="120" fill="#4dd0ff" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6">2 · APPLICATION API</text>
    <text x="518" y="140" fill="#c8ffe0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Next.js route handlers · no UI, no SDK</text>

    <rect x="518" y="154" width="200" height="66" rx="8" fill="#12211b" stroke="#37503f"/>
    <text x="530" y="174" fill="#c8ffe0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">/api/act</text>
    <text x="530" y="190" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">/api/briefs</text>
    <text x="530" y="206" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">/api/followups</text>

    <rect x="730" y="154" width="204" height="66" rx="8" fill="#12211b" stroke="#37503f"/>
    <text x="742" y="174" fill="#c8ffe0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">/api/actions/[id]</text>
    <text x="742" y="190" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">the receipt, by id</text>
    <text x="742" y="206" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">CORS · shared key</text>
  </g>

  <!-- Layer 3 (the emphasised one) -->
  <g>
    <rect x="238" y="286" width="504" height="152" rx="16" fill="#0d2018" stroke="#7dffa8" stroke-width="2.5"/>
    <text x="258" y="314" fill="#7dffa8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6">3 · INTELLIGENCE ENGINE</text>
    <text x="258" y="334" fill="#e8f5ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">pure · no SDK, no DOM, no fetch · 275 tests</text>

    <rect x="258" y="348" width="146" height="70" rx="8" fill="#10261d" stroke="#3c6a52"/>
    <text x="270" y="368" fill="#c8ffe0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">action-lifecycle</text>
    <text x="270" y="384" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">9 states</text>
    <text x="270" y="398" fill="#7dffa8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">reconciling</text>

    <rect x="416" y="348" width="146" height="70" rx="8" fill="#10261d" stroke="#3c6a52"/>
    <text x="428" y="368" fill="#c8ffe0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">actions.ts</text>
    <text x="428" y="384" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">one reducer</text>
    <text x="428" y="398" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">every gesture</text>

    <rect x="574" y="348" width="146" height="70" rx="8" fill="#10261d" stroke="#3c6a52"/>
    <text x="586" y="368" fill="#c8ffe0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">brief · commit</text>
    <text x="586" y="384" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">deterministic</text>
    <text x="586" y="398" fill="#7d8f88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">no model decides</text>
  </g>

  <!-- Layer 4 -->
  <g>
    <rect x="238" y="470" width="504" height="106" rx="14" fill="#0e1a15" stroke="#2a3a32"/>
    <text x="258" y="496" fill="#a78bfa" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6">4 · INTEGRATIONS</text>
    <text x="258" y="514" fill="#c8ffe0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">the only layer that holds a provider token</text>

    <rect x="258" y="524" width="112" height="34" rx="7" fill="#12211b" stroke="#37503f"/>
    <text x="268" y="546" fill="#c8ffe0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10">Notion · r/w</text>

    <rect x="380" y="524" width="96" height="34" rx="7" fill="#12211b" stroke="#37503f"/>
    <text x="390" y="546" fill="#c8ffe0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10">Resend</text>

    <rect x="486" y="524" width="72" height="34" rx="7" fill="#12211b" stroke="#37503f"/>
    <text x="496" y="546" fill="#c8ffe0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10">Exa</text>

    <rect x="568" y="524" width="152" height="34" rx="7" fill="#12211b" stroke="#37503f"/>
    <text x="578" y="546" fill="#c8ffe0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10">Neon Postgres (store)</text>
  </g>

  <!-- dependencies -->
  <line x1="254" y1="242" x2="380" y2="286" stroke="#7dffa8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="242" x2="600" y2="286" stroke="#7dffa8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="438" x2="490" y2="470" stroke="#7dffa8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="200" x2="760" y2="470" stroke="#4a5f57" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrowDim)"/>

  <text x="28" y="576" fill="#6d8079" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5">solid = allowed dependency · dashed = API → integrations (the write path) · the core cannot import any of the others</text>
</svg>
